<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Il mio allenamento</title>
<style>
:root{--bg:#f5f7f4;--card:#fff;--tx:#1b2a21;--mu:#66756b;--ac:#1f8a5b;--wa:#d9822b;--ln:#e1e6df;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111912;--card:#1b261e;--tx:#eaf1ec;--mu:#9aab9f;--ln:#2b3a2f}}
:root[data-theme="dark"]{--bg:#111912;--card:#1b261e;--tx:#eaf1ec;--mu:#9aab9f;--ln:#2b3a2f}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,sans-serif}
#app{max-width:480px;margin:auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 6px}
.c{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
.mu{color:var(--mu);font-size:14px}
button{font:inherit;border:0;border-radius:14px;padding:14px;width:100%;background:var(--ac);color:#fff;font-weight:600;margin-top:8px}
button.s{background:transparent;color:var(--tx);border:1px solid var(--ln)}
button.w{background:var(--wa)}
.big{font-size:64px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1}
.ph{text-align:center;font-size:22px;font-weight:700}
.bar{height:10px;background:var(--ln);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}.g b{display:block;font-size:20px}
input[type=number],textarea{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)}
input[type=range]{width:100%}
.r{display:flex;gap:8px}.r>*{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 2px;border-bottom:1px solid var(--ln);text-align:left}
</style></head><body><div id="app"></div>
<script>
const LV=[[0,0,0],[20,120,8],[30,120,8],[60,120,8],[90,120,7],[120,120,7],[180,120,6],[240,120,5],[300,120,5],[480,120,3],[600,90,3],[1200,60,2]];
const EX=['Plank sulle ginocchia','Dead bug (supino, braccio/gamba opposti)','Bird-dog (quadrupedia)','Ponte glutei','Plank laterale sulle ginocchia (dx)','Plank laterale sulle ginocchia (sx)'];
let S={level:0,hold:20,ss:[],body:[]};
try{const x=localStorage.getItem('al1');if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
if(!S.v){S.v=2;if(S.ss.length)S.level+=2}
if(!S.start)S.start=new Date().toISOString();
const save=()=>{try{localStorage.setItem('al1',JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id),A=$('app');
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const ago=d=>(Date.now()-new Date(d))/864e5;
const F=b=>`<svg viewBox="0 0 200 90" width="100%" style="max-height:150px"><g fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--tx)"><line x1="8" y1="82" x2="192" y2="82" style="stroke:var(--ln)"/>${b}</g></svg>`;
const FG=[
F('<path d="M25 78L55 78L55 52L125 60L150 78L182 66"/><circle cx="42" cy="45" r="8"/>'),
F('<path d="M40 76L110 76M45 74L45 34M45 74L58 36M110 76L110 40L146 40M110 76L182 68"/><circle cx="26" cy="70" r="8"/>'),
F('<path d="M135 50L65 50M135 50L135 78M135 50L192 42M65 50L65 76L40 78M65 50L10 46"/><circle cx="148" cy="58" r="8"/>'),
F('<path d="M35 76L130 38L152 78L168 78M35 77L78 77"/><circle cx="20" cy="70" r="8"/>'),
F('<path d="M25 78L50 78L50 52L120 58L150 78L122 80M50 52L78 20"/><circle cx="36" cy="44" r="8"/>')];
FG.push(FG[4].replace('<g fill','<g transform="translate(200,0) scale(-1,1)" fill'));
const DS=['Avambracci e ginocchia a terra, corpo in linea dalle ginocchia alla testa, pancia contratta.','A pancia in su, braccia al soffitto e ginocchia a 90°. Abbassa braccio e gamba opposti senza staccare la zona lombare.','A quattro zampe: allunga un braccio e la gamba opposta fino a una linea retta, poi cambia lato.','A pancia in su, piedi a terra: solleva il bacino stringendo i glutei, senza inarcare la schiena.','Su un fianco, gomito sotto la spalla e ginocchia piegate: solleva il bacino in linea.',"Come il precedente, sull'altro fianco."];
function guide(){A.innerHTML='<h1>Guida esercizi</h1>'+EX.map((e,i)=>`<div class="c"><h2>${e}</h2>${FG[i]}<div class="mu">${DS[i]}</div></div>`).join('')+'<button class="s" id="bk">Indietro</button>';$('bk').onclick=home}
let W=null,ac=null,wl=null;
function wlk(){try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>wl=l).catch(()=>{})}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(W&&!document.hidden)wlk()});

function weekMin(){return Math.round(S.ss.filter(s=>ago(s.d)<7).reduce((a,s)=>a+s.dur,0)/60)}
function nextType(){const l=S.ss[S.ss.length-1];return l&&l.type==='cardio'?'core':'cardio'}
function cardioSegs(){const[r,w,n]=LV[S.level];const g=[{n:'Cammina veloce (riscaldamento)',s:300,k:'w'}];
 if(!r)g.push({n:'Cammina veloce',s:1200,k:'w'});for(let i=0;i<n;i++){g.push({n:'CORRI piano',s:r,k:'r'});g.push({n:'Cammina',s:w,k:'w'})}
 g.push({n:'Cammina (defaticamento)',s:300,k:'w'});return g}
function coreSegs(){const g=[];for(let r=0;r<2;r++)EX.forEach(e=>{g.push({n:e,s:S.hold,k:'r'});g.push({n:'Riposo',s:20,k:'w'})});return g}

function home(){const t=nextType(),m=weekMin(),kc7=Math.round(S.ss.filter(x=>ago(x.d)<7).reduce((a,x)=>a+(x.kcal||0),0)),pf=S.prof||{},bw=(S.body.filter(x=>x.kg).pop()||{}).kg,bc=(S.body.filter(x=>x.cm).pop()||{}).cm,bmr=pf.h&&pf.age&&pf.sex&&bw?Math.round(10*bw+6.25*pf.h-5*pf.age+(pf.sex==='M'?5:-161)):0,last=S.ss[S.ss.length-1];
 const [r,w,n]=LV[S.level],N=Math.floor(ago(S.start)/7)+1,tg=Math.min(150,80+10*N),b=S.body[S.body.length-1];
 A.innerHTML=`<h1>Il mio allenamento</h1>
 <div class="c"><h2>Programma di ripresa · settimana ${N}</h2><div class="bar"><i style="width:${Math.min(100,m/tg*100)}%"></i></div><div class="mu">${m} min su ${tg} questa settimana. Si sale gradualmente fino a 150 min (soglia utile per colesterolo e fegato grasso). Schema: 3 cardio + 2 core, con almeno un giorno di riposo tra i cardio.<br>Calorie stimate negli ultimi 7 giorni: <b>${kc7}</b>${S.body.some(b=>b.kg)?'':' (inserisci il peso per calcolarle)'}.</div></div>
 <div class="c"><h2>Metabolismo</h2><div class="mu">${bmr?`Basale stimato: <b>${bmr} kcal/giorno</b> (a riposo). Fabbisogno giornaliero stimato: <b>${Math.round(bmr*1.2+kc7/7)} kcal</b>, con la tua attività recente.${bc?` Girovita/altezza: <b>${(bc/pf.h).toFixed(2)}</b> (obiettivo sotto 0,50).`:''}`:'Per calcolarlo servono sesso, altezza e peso: completa il profilo in "Piano e dati" e salva il peso qui sotto.'}</div></div>
 <div class="c"><h2>Oggi: ${t==='cardio'?'Camminata + corsa a intervalli':'Core per la schiena'}</h2>
 <div class="mu">${t==='cardio'?r?`Livello ${S.level+1}/${LV.length}: 5' cammino, poi ${n}× (${mmss(r)} corsa lenta + ${mmss(w)} cammino), 5' defaticamento. Totale ~${Math.round((600+n*(r+w))/60)} min. Ritmo: devi riuscire a parlare.`:`Livello 1/${LV.length}: 30 min di camminata veloce (5' riscaldamento, 20' a passo sostenuto, 5' defaticamento) per riprendere dopo la pausa estiva.`:`2 giri di 6 esercizi sicuri per la schiena, ${S.hold}s ciascuno con 20s di riposo. Respira, schiena neutra.`}</div>
 <button id="go">Inizia</button><button class="s" id="alt">Fai ${t==='cardio'?'core':'cardio'} invece</button></div>
 ${last?`<div class="c mu"><b>Ultima volta:</b> ${last.type==='cardio'?'cardio':'core'}, ${Math.round(last.dur/60)} min, sforzo ${last.rpe}/10${last.pain?', dolore alla schiena':''}. ${S.msg||''}</div>`:''}
 <div class="c"><h2>Peso e vita</h2><div class="r"><input id="kg" type="number" step="0.1" placeholder="kg"><input id="cm" type="number" step="0.5" placeholder="vita cm"></div><button class="s" id="sb">Salva misure</button><div class="mu">${b?`Ultime: ${b.kg||'–'} kg, vita ${b.cm||'–'} cm`:''}</div></div>
 <div class="r"><button class="s" id="pg">Progressi</button><button class="s" id="hs">Storico</button></div><div class="r"><button class="s" id="st">Piano e dati</button><button class="s" id="gd">Guida esercizi</button></div>
 <p class="mu">Prima di iniziare chiedi il via al medico (età, colesterolo, fegato). Fermati se hai dolore al petto, capogiri o dolore alla schiena.</p>`;
 $('go').onclick=()=>start(t);$('alt').onclick=()=>start(t==='cardio'?'core':'cardio');$('hs').onclick=hist;$('pg').onclick=prog;$('st').onclick=setup;$('gd').onclick=guide;
 $('sb').onclick=()=>{const kg=+$('kg').value,cm=+$('cm').value;if(kg||cm){S.body.push({d:new Date().toISOString(),kg,cm});save();home()}}}

function beep(n){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();for(let i=0;i<n;i++){const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=880;g.gain.value=.2;o.start(ac.currentTime+i*.25);o.stop(ac.currentTime+i*.25+.15)}}catch(e){}
 try{navigator.vibrate&&navigator.vibrate(n*200)}catch(e){}}

function start(type){const segs=type==='cardio'?cardioSegs():coreSegs();
 W={type,segs,tot:segs.reduce((a,s)=>a+s.s,0),t0:Date.now(),idx:-1,dist:0,last:null,gps:false,stop:false};
 try{ac=ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
 wlk();
 try{if(type==='cardio'){const BG=nat();if(BG){BG.addWatcher({backgroundTitle:'Allenamento in corso',backgroundMessage:'Sto registrando il percorso',requestPermissions:true,stale:false,distanceFilter:3},(l,er)=>{if(!W)return;if(er){W.err=er.code==='NOT_AUTHORIZED'?1:2;return}fix(l,l.time)}).then(id=>{if(W&&!W.fin)W.nid=id;else BG.removeWatcher({id})}).catch(()=>{if(W)W.err=2})}else if(navigator.geolocation){try{W.wid=navigator.geolocation.watchPosition(p=>fix(p.coords,p.timestamp),er=>{W.err=er.code},{enableHighAccuracy:true})}catch(er){}}}}catch(er){W.errm=String((er&&er.message)||er)}
 A.innerHTML=`<h1>${type==='cardio'?'Cardio':'Core'}</h1><div class="c"><div class="ph" id="ph"></div><div class="big" id="tm"></div><div class="mu" style="text-align:center" id="nx"></div></div>
 ${type==='core'?'<div class="c" id="fg" style="padding:8px"></div>':''}<div class="c"><div class="bar"><i id="pb" style="width:0"></i></div><div class="g" style="margin-top:10px"><div><b id="el">0:00</b><span class="mu">tempo</span></div><div><b id="ds">–</b><span class="mu">distanza</span></div><div><b id="pc">–</b><span class="mu">min/km</span></div></div><div class="mu" id="gs" style="margin-top:8px;text-align:center"></div></div>
 <button class="w" id="fin">Termina</button>`;
 $('fin').onclick=()=>finish(false);W.iv=setInterval(tick,300);tick()}
const nat=()=>{try{return window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()&&(Capacitor.registerPlugin?Capacitor.registerPlugin('BackgroundGeolocation'):Capacitor.Plugins.BackgroundGeolocation)}catch(e){return null}};
function fix(c,nt){nt=nt||Date.now();W.fx=(W.fx||0)+1;if(W.lt)W.mg=Math.max(W.mg||0,(nt-W.lt)/1000);W.lt=nt;if(c.accuracy>50)return;W.gps=true;const q={a:c.latitude,o:c.longitude};if(!W.last){W.last=q;W.lq=nt;return}const d=hav(W.last,q),dt=Math.max(1,(nt-W.lq)/1000);if(d<Math.max(3,c.accuracy/3))return;if(d/dt>6&&(W.bad=(W.bad||0)+1)<4)return;W.bad=0;W.dist+=d;W.last=q;W.lq=nt}
const fd=m=>m<1000?Math.round(m)+' m':(m/1000).toFixed(2)+' km';
function hav(a,b){const R=6371e3,r=x=>x*Math.PI/180,dl=r(b.a-a.a),dn=r(b.o-a.o);const h=Math.sin(dl/2)**2+Math.cos(r(a.a))*Math.cos(r(b.a))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function tick(){if(!W)return;const el=(Date.now()-W.t0)/1000;if(el>=W.tot){if(!W.over){W.over=true;beep(3)}$('ph').textContent='Programma completato: continua pure, sto registrando';$('ph').style.color='var(--ac)';$('tm').textContent=mmss(el-W.tot);$('nx').textContent='Tempo oltre il programma. Tocca Termina quando hai finito.';$('pb').style.width='100%';$('el').textContent=mmss(el);if(W.type==='cardio'){$('ds').textContent=W.gps?fd(W.dist):'–';$('pc').textContent=W.dist>100?mmss(el/(W.dist/1000)):'–'}return}
 let c=0,i=0;for(;i<W.segs.length;i++){if(el<c+W.segs[i].s)break;c+=W.segs[i].s}
 const sg=W.segs[i];if(i!==W.idx){if(W.idx>=0)beep(sg.k==='r'?2:1);W.idx=i}
 $('ph').textContent=sg.n;$('ph').style.color=sg.k==='r'?'var(--wa)':'var(--ac)';$('tm').textContent=mmss(c+sg.s-el);
 if($('fg'))$('fg').innerHTML=FG[Math.floor((i+(sg.k==='w'?1:0))/2)%6];const n=W.segs[i+1];$('nx').textContent=n?'Poi: '+n.n+' ('+mmss(n.s)+')':'Ultimo tratto';
 $('pb').style.width=el/W.tot*100+'%';$('el').textContent=mmss(el);
 if(W.type==='cardio'){$('ds').textContent=W.gps?fd(W.dist):'–';$('pc').textContent=W.dist>100?mmss(el/(W.dist/1000)):'–';$('gs').textContent=W.errm&&!W.gps?'Errore GPS: '+W.errm:W.gps?'GPS attivo':!navigator.geolocation?'GPS non supportato da questa pagina':W.err===1?'GPS bloccato: permesso di posizione negato':W.err?'GPS non disponibile (errore '+W.err+')':'GPS in attesa del segnale...'}}
function kc(w){const b=S.body.filter(x=>x.kg).pop();if(!b)return 0;let c=0,t=0;for(const g of w.segs){const u=Math.min(g.s,Math.max(0,w.dur-t));t+=g.s;const m=w.type==='cardio'?(g.k==='r'?8:4.3):(g.k==='r'?3:1.5);c+=(m-1)*b.kg*u/3600}c+=(w.type==='cardio'?3.3:2)*b.kg*Math.max(0,w.dur-t)/3600;return Math.round(c)}
function finish(done){clearInterval(W.iv);W.fin=true;try{W.nid&&nat().removeWatcher({id:W.nid})}catch(e){}try{W.wid!=null&&navigator.geolocation.clearWatch(W.wid)}catch(e){}try{wl&&wl.release()}catch(e){}
 const dur=Math.round((Date.now()-W.t0)/1000);if(done)beep(3);W.dur=dur;done=dur>=W.tot;W.kcal=kc(W);W.done=done;fb()}
function fb(){A.innerHTML=`<h1>${W.done?'Ben fatto!':'Sessione interrotta'}</h1>
 <div class="c"><b>${Math.round(W.dur/60)} min</b>${W.kcal?' · circa '+W.kcal+' kcal (stima)':''}${W.type==='cardio'?' · '+(W.gps?fd(W.dist):'<span class="mu">GPS non disponibile</span>'):''}
 ${W.type==='cardio'?`<div class="mu" style="margin-top:8px">Distanza in km. Puoi correggerla se hai un dato più affidabile (per esempio da un contapassi). Il GPS ha ricevuto ${W.fx||0} letture${W.mg?', pausa più lunga '+Math.round(W.mg)+' s':''}.</div><input id="md" type="number" step="0.01" value="${W.gps?(W.dist/1000).toFixed(2):''}">`:''}</div>
 <div class="c"><h2>Che fatica è stata? <span id="rv">5</span>/10</h2><input id="rp" type="range" min="1" max="10" value="5"><div class="mu">1-3 leggera · 4-6 moderata · 7-8 dura · 9-10 massima</div>
 <label style="display:block;margin-top:10px"><input type="checkbox" id="pn"> Ho avuto dolore alla schiena</label></div><button id="sv">Salva e calcola il prossimo</button>`;
 $('rp').oninput=e=>$('rv').textContent=e.target.value;
 $('sv').onclick=()=>{const rpe=+$('rp').value,pain=$('pn').checked,md=$('md')?+$('md').value:0;
  const up=S.pace==='veloce'?7:S.pace==='prudente'?5:6;const s={d:new Date().toISOString(),type:W.type,dur:W.dur,dist:md>0?Math.round(md*1000):(W.gps?Math.round(W.dist):0),kcal:W.kcal||0,rpe,pain,done:W.done,lv:S.level};const pv=S.ss.filter(x=>x.type==='cardio'&&x.lv===S.level&&x.dist>300&&x.dur>0).pop();const better=!!pv&&s.type==='cardio'&&s.dist>300&&s.dist/s.dur>=pv.dist/pv.dur*1.03&&rpe<=pv.rpe;S.ss.push(s);
  if(W.type==='cardio'){if(pain||rpe>=(S.pace==='prudente'?8:9)||!W.done&&rpe>=8){S.level=Math.max(0,S.level-1);S.msg='Prossimo cardio più leggero: recupera bene.'}
   else if(W.done&&(rpe<=up||better&&rpe<=up+1)){S.level=Math.min(LV.length-1,S.level+1);S.msg=(better?'Passo migliorato con sforzo non maggiore: ':'Sforzo gestito bene: ')+'il prossimo cardio sale di livello.'}
   else S.msg='Sforzo giusto: ripeti lo stesso livello per consolidare.'}
  else{if(pain){S.hold=Math.max(15,S.hold-5);S.msg='Core: tenute più brevi per proteggere la schiena.'}
   else if(W.done&&rpe<=up){S.hold=Math.min(45,S.hold+5);S.msg='Core: tenute più lunghe la prossima volta.'}else S.msg='Core: stessa durata.'}
  save();W=null;home()}}
function hist(){const rows=S.ss.slice().reverse().map(s=>`<tr><td>${new Date(s.d).toLocaleDateString('it-IT',{day:'numeric',month:'short'})}</td><td>${s.type==='cardio'?'Cardio L'+(s.lv+1):'Core'}</td><td>${Math.round(s.dur/60)}'</td><td>${s.dist?(s.dist/1000).toFixed(2):'–'}</td><td>${s.rpe}${s.pain?' ⚠':''}</td><td>${s.kcal||'–'}</td></tr>`).join('');
 const bd=S.body.slice().reverse().map(b=>`<tr><td>${new Date(b.d).toLocaleDateString('it-IT',{day:'numeric',month:'short'})}</td><td>${b.kg||'–'} kg</td><td>${b.cm||'–'} cm</td></tr>`).join('');
 A.innerHTML=`<h1>Storico</h1><div class="c"><table><tr><th>Data</th><th>Tipo</th><th>Durata</th><th>Km</th><th>Sforzo</th><th>Kcal</th></tr>${rows||'<tr><td colspan=6 class="mu">Nessuna sessione</td></tr>'}</table></div><div class="c"><table>${bd||'<tr><td class="mu">Nessuna misura</td></tr>'}</table></div><button class="s" id="bk">Indietro</button>`;$('bk').onclick=home}
function chart(t,pts,o={}){if(pts.length<2)return `<div class="c"><h2>${t}</h2><div class="mu">Servono almeno 2 dati per il grafico.</div></div>`;
 const w=320,h=140,p=26,vs=pts.map(x=>x.v),mn=o.bar?0:(o.min!=null?o.min:Math.min(...vs)-1),mx=Math.max(...vs,o.ref||0)+(o.bar?0:1),rg=(mx-mn)||1,n=pts.length;
 const Y=v=>h-p-(v-mn)/rg*(h-2*p),X=i=>o.bar?p+(i+.5)*(w-2*p)/n:p+i*(w-2*p)/(n-1);
 let g=`<line x1="${p}" x2="${w-p}" y1="${h-p}" y2="${h-p}" style="stroke:var(--ln)"/>`;
 if(o.ref)g+=`<line x1="${p}" x2="${w-p}" y1="${Y(o.ref)}" y2="${Y(o.ref)}" stroke-dasharray="4" style="stroke:var(--wa)"/><text x="${w-p}" y="${Y(o.ref)-3}" text-anchor="end" font-size="9" style="fill:var(--wa)">obiettivo ${o.ref}</text>`;
 if(o.bar){const bw=(w-2*p)/n*.65;pts.forEach((q,i)=>g+=`<rect x="${X(i)-bw/2}" y="${Y(q.v)}" width="${bw}" height="${h-p-Y(q.v)}" rx="3" style="fill:var(--ac)"/><text x="${X(i)}" y="${Y(q.v)-3}" text-anchor="middle" font-size="9" style="fill:var(--tx)">${q.v}</text>`)}
 else{g+=`<polyline fill="none" stroke-width="2.5" points="${pts.map((q,i)=>X(i)+','+Y(q.v)).join(' ')}" style="stroke:var(--ac)"/>`;pts.forEach((q,i)=>g+=`<circle cx="${X(i)}" cy="${Y(q.v)}" r="3.5" style="fill:var(--ac)"/>`+((n<=8||i==n-1||i==0)?`<text x="${X(i)}" y="${Y(q.v)-7}" text-anchor="middle" font-size="9" style="fill:var(--tx)">${q.v}</text>`:''))}
 pts.forEach((q,i)=>{if(n<=8||i==0||i==n-1)g+=`<text x="${X(i)}" y="${h-8}" text-anchor="middle" font-size="9" style="fill:var(--mu)">${q.l}</text>`});
 let tr='';if(!o.bar){const d=vs[n-1]-vs[0],good=o.low?d<0:d>0;tr=d===0?'stabile':`<b style="color:${good?'var(--ac)':'var(--wa)'}">${d>0?'+':''}${Math.round(d*10)/10}${o.u||''} dall'inizio</b>`}
 return `<div class="c"><h2>${t}</h2><svg viewBox="0 0 ${w} ${h}" width="100%">${g}</svg><div class="mu">${tr}</div></div>`}
function prog(){const dl=d=>new Date(d).toLocaleDateString('it-IT',{day:'numeric',month:'numeric'});
 const wk=[];for(let k=7;k>=0;k--)wk.push({l:k?'-'+k+'s':'ora',v:Math.round(S.ss.filter(x=>Math.floor(ago(x.d)/7)===k).reduce((a,x)=>a+x.dur,0)/60)});
 const wk2=wk.map((x,i)=>({l:x.l,v:Math.round(S.ss.filter(y=>Math.floor(ago(y.d)/7)===7-i).reduce((a,y)=>a+(y.kcal||0),0))}));
 const cs=S.ss.filter(x=>x.type==='cardio'),bw=S.body.filter(b=>b.kg),bc=S.body.filter(b=>b.cm);
 A.innerHTML=`<h1>Progressi</h1>`+chart('Minuti di attività per settimana',wk,{bar:1,ref:150})
 +chart('Calorie stimate per settimana',wk2,{bar:1})
 +chart('Livello cardio (sale = migliori, scende = ti ho alleggerito)',cs.map(x=>({l:dl(x.d),v:x.lv+1})),{min:0})
 +chart('Sforzo percepito nel cardio (1-10)',cs.map(x=>({l:dl(x.d),v:x.rpe})),{min:0,low:1})
 +chart('Passo medio della sessione (min/km, più basso = meglio)',cs.filter(x=>x.dist>300).map(x=>({l:dl(x.d),v:Math.round(x.dur/60/(x.dist/1000)*10)/10})),{low:1,u:' min/km'})
 +chart('Peso (kg)',bw.map(b=>({l:dl(b.d),v:b.kg})),{low:1,u:' kg'})
 +chart('Girovita (cm)',bc.map(b=>({l:dl(b.d),v:b.cm})),{low:1,u:' cm'})
 +`<div class="c mu"><h2>E il grasso del fegato?</h2>Nessuna app può misurarlo: lo valutano ecografia o elastografia e gli esami che decide il medico. Qui vedi indicatori indiretti che lo influenzano: minuti di attività (150 a settimana), girovita e peso. Le calorie sono stime basate sul tuo peso e sul tipo di attività (margine di errore anche del 20-30%) e non indicano quanto grasso consumi.</div><button class="s" id="bk">Indietro</button>`;$('bk').onclick=home}
function setup(){const ld=i=>LV[i][0]?`${LV[i][2]}× (${mmss(LV[i][0])} corsa + ${mmss(LV[i][1])} cammino)`:'30 min di camminata veloce';
 const pc=S.pace||'normale';
 A.innerHTML=`<h1>Piano e dati</h1>
 <div class="c"><h2>Profilo (per il metabolismo)</h2><div class="r"><button class="${(S.prof||{}).sex==='M'?'':'s'}" id="sx1">Uomo</button><button class="${(S.prof||{}).sex==='F'?'':'s'}" id="sx2">Donna</button></div><div class="r" style="margin-top:8px"><input id="ph" type="number" placeholder="altezza cm" value="${(S.prof||{}).h||''}"><input id="pa" type="number" placeholder="età" value="${(S.prof||{}).age||59}"></div><button class="s" id="ps">Salva profilo</button></div>
 <div class="c"><h2>Cardio: livello ${S.level+1} di ${LV.length}</h2><div class="mu">${ld(S.level)}</div><div class="r"><button class="s" id="ld">− Più facile</button><button class="s" id="lu">Più difficile +</button></div><div class="mu">Da qui in poi il piano continua a adattarsi alle tue prestazioni.</div></div>
 <div class="c"><h2>Core: tenuta ${S.hold} secondi</h2><div class="r"><button class="s" id="hd">− 5 s</button><button class="s" id="hu">+ 5 s</button></div></div>
 <div class="c"><h2>Velocità di progressione</h2><div class="mu">Il livello sale se completi la sessione senza dolore e con sforzo entro: prudente 5, normale 6, veloce 7 (su 10).</div><div class="r">${['prudente','normale','veloce'].map(k=>`<button class="${pc===k?'':'s'}" data-p="${k}">${k}</button>`).join('')}</div></div>
 <div class="c"><h2>Copia dei dati</h2><button id="ex">Esporta dati (file)</button>
 <textarea id="ta" rows="4" placeholder="Per ripristinare: scegli il file o incolla qui il contenuto, poi premi Importa" style="margin-top:8px"></textarea>
 <input type="file" id="fl" accept=".json,.txt" style="margin-top:6px"><button class="s" id="im">Importa</button><div class="mu" id="msg"></div></div>
 <div class="c"><h2>Ricomincia</h2><div class="mu">Nuovo programma: riparte dalla settimana 1 e dal livello 1, ma conserva storico e misure. Cancella tutto: elimina anche quelli (fai prima un'esportazione).</div><button class="s" id="r1">Nuovo programma (tieni lo storico)</button><button class="s" id="r2">Cancella tutto e riparti da zero</button></div>
 <button class="s" id="bk">Indietro</button>`;
 const ch=f=>()=>{f();save();setup()};
 S.prof=S.prof||{age:59};const pu=()=>{S.prof.h=+$('ph').value||S.prof.h;S.prof.age=+$('pa').value||S.prof.age};
 $('sx1').onclick=ch(()=>{pu();S.prof.sex='M'});$('sx2').onclick=ch(()=>{pu();S.prof.sex='F'});$('ps').onclick=ch(pu);
 $('ld').onclick=ch(()=>S.level=Math.max(0,S.level-1));$('lu').onclick=ch(()=>S.level=Math.min(LV.length-1,S.level+1));
 $('hd').onclick=ch(()=>S.hold=Math.max(15,S.hold-5));$('hu').onclick=ch(()=>S.hold=Math.min(60,S.hold+5));
 document.querySelectorAll('[data-p]').forEach(b=>b.onclick=ch(()=>S.pace=b.dataset.p));
 $('bk').onclick=home;
 const two=(id,txt,f)=>{const b=$(id);let a=0;b.onclick=()=>{if(!a){a=1;b.textContent='Tocca ancora per confermare';setTimeout(()=>{a=0;b.textContent=txt},4000)}else f()}};
 two('r1','Nuovo programma (tieni lo storico)',()=>{S.level=0;S.hold=20;S.start=new Date().toISOString();S.msg='';save();home()});
 two('r2','Cancella tutto e riparti da zero',()=>{S={level:0,hold:20,ss:[],body:[],v:2,start:new Date().toISOString()};save();home()});
 $('fl').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>$('ta').value=r.result;r.readAsText(f)};
 $('ex').onclick=async()=>{const js=JSON.stringify(S,null,1);let d=null;
  try{d=window.claude&&await claude.use('downloads')}catch(e){}
  const fb=()=>{$('ta').value=js;$('ta').select();$('msg').textContent='Copia questo testo e conservalo in una nota: per ripristinare incollalo qui e premi Importa.'};
  if(!d&&window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()){fb();return}
  if(!d){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([js],{type:'application/json'}));a.download='allenamento-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();$('ta').value=js;$('msg').textContent='File scaricato. Se non lo trovi, copia il testo qui sopra.'}catch(e){fb()}return}
  try{await d.save({filename:'allenamento-'+new Date().toISOString().slice(0,10)+'.json',data:js});$('msg').textContent='File salvato.'}
  catch(e){if(e&&e.code==='declined')$('msg').textContent='Salvataggio annullato.';else fb()}};
 $('im').onclick=()=>{try{const o=JSON.parse($('ta').value);if(!Array.isArray(o.ss))throw 0;S=Object.assign({level:0,hold:20,ss:[],body:[]},o);save();home()}catch(e){$('msg').textContent='Contenuto non valido.'}}}
home();
</script></body></html>
